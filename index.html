<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <ul>
        <li>MyTicTacToe.com</li>
      </ul>
    </nav>

    <div class="gameContainer">
      <div class="container">
        <div class="box" data-index="0"><span class="boxtext"></span></div>
        <div class="box" data-index="1"><span class="boxtext"></span></div>
        <div class="box" data-index="2"><span class="boxtext"></span></div>
        <div class="box" data-index="3"><span class="boxtext"></span></div>
        <div class="box" data-index="4"><span class="boxtext"></span></div>
        <div class="box" data-index="5"><span class="boxtext"></span></div>
        <div class="box" data-index="6"><span class="boxtext"></span></div>
        <div class="box" data-index="7"><span class="boxtext"></span></div>
        <div class="box" data-index="8"><span class="boxtext"></span></div>
      </div>

      <div class="gameInfo">
        <h1>Tic Tac Toe</h1>
        <div class="status-container">
          <span class="info">Turn for X</span>
          <button id="reset">Reset Game</button>
        </div>
        <div class="imgbox">
          <img src="excited.gif" alt="Winner" />
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
